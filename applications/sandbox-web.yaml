apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-web
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/flmora/aapautomation.git
    targetRevision: main
    path: apps/web
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
