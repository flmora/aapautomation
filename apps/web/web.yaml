apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-web-page
  namespace: sandbox
data:
  index.html: |
    <!doctype html>
    <html lang="pt">
      <head>
        <meta charset="utf-8">
        <title>Sandbox web</title>
      </head>
      <body>
        <h1>Sandbox web</h1>
        <p>Publicado pelo OpenShift GitOps.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-web
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-web
  template:
    metadata:
      labels:
        app: sandbox-web
    spec:
      containers:
        - name: web
          image: quay.io/nginx/nginx-unprivileged:stable-alpine-slim
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: sandbox-web-page
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-web
  namespace: sandbox
spec:
  selector:
    app: sandbox-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sandbox-web
  namespace: sandbox
spec:
  to:
    kind: Service
    name: sandbox-web
  port:
    targetPort: http
